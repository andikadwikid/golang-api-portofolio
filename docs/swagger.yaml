paths:
  /certificate:
    post:
      consumes:
      - multipart/form-data
      description: Create a new certificate entry for a user with file upload
      parameters:
      - description: Certificate Title
        in: formData
        name: title
        required: true
        type: string
      - description: Certificate Organizer
        in: formData
        name: organizer
        required: true
        type: string
      - description: Certificate Year
        in: formData
        name: year
        required: true
        type: string
      - description: Certificate Description
        in: formData
        name: description
        type: string
      - description: Certificate file (pdf, png, jpg, jpeg)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new certificate entry
      tags:
      - certificate
  /certificate/{id}:
    delete:
      description: Delete a certificate entry by ID for the owner
      parameters:
      - description: Certificate ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a certificate entry
      tags:
      - certificate
    get:
      description: Retrieve a single certificate entry by its ID
      parameters:
      - description: Certificate ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Certificate'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get certificate entry by ID
      tags:
      - certificate
    put:
      consumes:
      - multipart/form-data
      description: Update a certificate entry by ID, optionally replacing the file
      parameters:
      - description: Certificate ID
        in: path
        name: id
        required: true
        type: string
      - description: Certificate Title
        in: formData
        name: title
        type: string
      - description: Certificate Organizer
        in: formData
        name: organizer
        type: string
      - description: Certificate Year
        in: formData
        name: year
        type: string
      - description: Certificate Description
        in: formData
        name: description
        type: string
      - description: New certificate file (pdf, png, jpg, jpeg)
        in: formData
        name: file
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a certificate entry
      tags:
      - certificate
  /certificate/user/{user_id}:
    get:
      description: Retrieve a list of all certificate entries for a specific user
